name: Agent PR
on:
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci 2>/dev/null || true
      - name: Lint check
        run: echo "✓ PR ready for NOEDIS QA"
